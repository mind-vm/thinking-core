# Build, vet, and test the Go module on every push and pull request.
#
# Deliberately not filtered by path. A docs-only change cannot break the
# library, but a required check that skips itself reports "pending" forever
# and has to be overridden by hand — which trains people to override it. The
# job takes under a minute; running it always is cheaper than that habit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Two operating systems because the exec pack is not portable by
    # accident: process-group handling is behind a build tag, and a change
    # that compiles on one Unix can still be wrong on another.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          # Tracks go.mod rather than pinning here, so the toolchain cannot
          # drift away from what the module says it needs.
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The race detector earns its runtime here: the sandbox is driven from
      # the loop's goroutines, the exec pack reads two pipes while waiting on
      # a process, and SQLite is reached from several at once.
      - name: Test
        run: go test -race -timeout 10m ./...

  # Compile for every target the CLI is released for. This is what catches a
  # build-tag mistake in the platform-specific exec files, which the test job
  # above cannot see because it only ever builds for its own host.
  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  # ext/mcp is a module of its own so the MCP SDK stays out of the core's
  # go.mod, which means `go test ./...` at the root never reaches it. It
  # replaces the core with ../.., so this is also where a change to
  # ext.MCPPack or the cli package shows up as a broken client or binary.
  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ext/mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: ext/mcp/go.mod
          cache: true
          cache-dependency-path: ext/mcp/go.sum
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  # examples/blocks-tabler is a module of its own — templ and tabler-templ
  # stay out of the core's go.mod — so `go test ./...` at the root never
  # reaches it. It replaces the core with ../.., which makes it the one place
  # a change to the blocks contract shows up as a broken renderer.
  blocks-tabler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/blocks-tabler
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: examples/blocks-tabler/go.mod
          cache: true
          cache-dependency-path: examples/blocks-tabler/go.sum
      # The generated _templ.go files are committed so `go run .` needs no
      # tool; this fails when a .templ file was edited without regenerating.
      - name: Generated templ code is current
        run: |
          go tool templ generate
          git diff --exit-code -- .
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  # The Dockerfile is the only thing that builds ext/mcp from the repo root, so
  # a change to either go.mod or the cli package can break it unseen. Both
  # targets, no push and no registry login: this proves the image builds, it
  # does not publish one.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build default (distroless) image
        run: docker buildx build --load -t thinking-core:ci .
      - name: Build alpine image
        run: docker buildx build --load --target alpine -t thinking-core:ci-alpine .
      - name: Refuses to listen publicly without a token
        run: |
          out="$(docker run --rm -v "$PWD/examples/serve/config.json:/etc/thinking-core/config.json:ro" thinking-core:ci 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "not a loopback address"
